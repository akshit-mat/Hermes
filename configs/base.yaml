model:
  vocab_size: 16000
  context_length: 256
  d_model: 384
  n_layers: 6
  n_heads: 6
  dropout: 0.0

training:
  batch_size: 8
  gradient_accumulation_steps: 8
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 500
  max_steps: 10000
  grad_clip: 1.0

data:
  seed: 42

logging:
  use_wandb: true